services:
  - type: web
    name: generadorplanillamexico
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: blog-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Tijuana
      - key: BLOG_STORAGE_DIR
        value: /var/data
